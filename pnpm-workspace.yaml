packages:
  - "apps/*"
  - "packages/*"
  - "contracts"

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@prisma/adapter-pg': true
  '@scarf/scarf': false
  '@swc/core': true
  esbuild: true
  prisma: true
  sharp: false
  unrs-resolver: true

# Treat these as workspace-level catalogs so version bumps are global.
catalog:
  typescript: ^6.0.3
  zod: ^4.4.3
  viem: ^2.54.2
  "@types/node": ^26.1.0
  eslint: ^10.6.0
  prettier: ^3.3.0
  turbo: ^2.0.0
  vitest: ^4.1.9
  "@changesets/cli": ^2.27.0

onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - '@prisma/adapter-pg'
  - '@swc/core'
  - esbuild
  - unrs-resolver
